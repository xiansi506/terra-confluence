# ============================================================
# Terra Confluence —— 项目基础配置
# ============================================================

# ---- JVM / Gradle 参数 ----
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
# 禁用 Gradle 原生文件监听（在部分受限环境/沙箱中会挂死构建）
org.gradle.vfs.watch=false

# ---- 网络超时（网络慢时避免下载失败）----
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=5000

# ---- 模组信息 ----
mod_id=terra_plate_extension
mod_name=Terra Confluence
mod_version=1.0.20
mod_group=com.example.terraplateextension
mod_authors=Terra Confluence Team

# ---- Minecraft / Forge / 映射 ----
minecraft_version=1.20.1
forge_version=47.2.0
mappings_channel=official
mappings_version=1.20.1

# ---- 依赖版本 ----
# 依赖获取方式开关：
#   true  = 使用 libs/ 目录中手动下载的 jar（离线，默认）
#   false = 从在线 Maven 自动下载（下面的版本号才会被使用）
use_local_deps=true

# Botania（Modrinth Maven，无需文件 ID；仅 use_local_deps=false 时使用）
#   可用版本查询：https://modrinth.com/mod/botania/versions?g=1.20.1&l=forge
#   或查看 maven 目录：https://api.modrinth.com/maven/maven/modrinth/botania/
botania_version=1.20.1-441-forge

# Patchouli（Botania 1.20.1 的运行时依赖；仅 use_local_deps=false 时使用）
#   可用版本查询：https://modrinth.com/mod/patchouli/versions?g=1.20.1&l=forge
patchouli_version=1.20.1-81-forge

# JEI（maven.blamejared.com；仅 use_local_deps=false 时使用）
#   可用版本查询：https://maven.blamejared.com/mezz/jei/jei-1.20.1-forge/
jei_version=15.2.0.27
